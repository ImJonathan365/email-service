spring:
  application:
    name: email-service
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # Both DataSources are defined explicitly (ADR-0008), and APP_ROLE=migrate has none.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    url: ${app.db.url}
    user: ${app.db.owner.username}
    password: ${app.db.owner.password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # AC-24.1: liveness never depends on anything external, readiness only on the database.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

app:
  env: ${APP_ENV:local}
  role: ${APP_ROLE:all}
  db:
    url: ${DB_URL:}
    app:
      username: ${DB_APP_USER:}
      password: ${DB_APP_PASSWORD:}
    system:
      username: ${DB_SYSTEM_USER:}
      password: ${DB_SYSTEM_PASSWORD:}
    owner:
      username: ${DB_OWNER_USER:}
      password: ${DB_OWNER_PASSWORD:}
  http:
    trusted-proxies: ${TRUSTED_PROXIES:}
  admin:
    api-keys: ${ADMIN_API_KEYS:}
  tenancy:
    default-rate-limit-per-minute: ${DEFAULT_RATE_LIMIT_PER_MINUTE:60}
    default-daily-quota: ${DEFAULT_DAILY_QUOTA:1000}
    default-retention-days: ${DEFAULT_RETENTION_DAYS:90}
    supported-locales: ${SUPPORTED_LOCALES:es-CR,en}
