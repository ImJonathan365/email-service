spring:
  application:
    name: email-service
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # Both DataSources are defined explicitly (ADR-0008), and APP_ROLE=migrate has none.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      # The SMTP sender exists only with MAIL_PROVIDER=smtp and is built in the provider package; no
      # startup connection test and no health check that would contact the mail server.
      - org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
      - org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration
      - org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration
  flyway:
    url: ${app.db.url}
    user: ${app.db.owner.username}
    password: ${app.db.owner.password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component names and statuses (queue, provider, db) are shown; their details stay hidden.
      show-components: always
      # AC-24.4: a slow queue or provider degrades /actuator/health but answers 200.
      status:
        order: down, out-of-service, degraded, up, unknown
        http-mapping:
          degraded: 200
      group:
        # AC-24.1: liveness never depends on anything external, readiness only on the database.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

app:
  env: ${APP_ENV:local}
  role: ${APP_ROLE:all}
  db:
    url: ${DB_URL:}
    app:
      username: ${DB_APP_USER:}
      password: ${DB_APP_PASSWORD:}
    system:
      username: ${DB_SYSTEM_USER:}
      password: ${DB_SYSTEM_PASSWORD:}
    owner:
      username: ${DB_OWNER_USER:}
      password: ${DB_OWNER_PASSWORD:}
  http:
    trusted-proxies: ${TRUSTED_PROXIES:}
    auth-failures-per-minute-per-ip: ${AUTH_FAILURES_PER_MINUTE_PER_IP:30}
  admin:
    api-keys: ${ADMIN_API_KEYS:}
  tenancy:
    default-rate-limit-per-minute: ${DEFAULT_RATE_LIMIT_PER_MINUTE:60}
    default-daily-quota: ${DEFAULT_DAILY_QUOTA:1000}
    default-retention-days: ${DEFAULT_RETENTION_DAYS:90}
    supported-locales: ${SUPPORTED_LOCALES:es-CR,en}
    anomaly-volume-multiplier: ${ANOMALY_VOLUME_MULTIPLIER:3}
    anomaly-min-hourly: ${ANOMALY_MIN_HOURLY:50}
    bounce-pause-rate: ${BOUNCE_PAUSE_RATE:0.04}
    complaint-pause-rate: ${COMPLAINT_PAUSE_RATE:0.001}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    smtp-host: ${SMTP_HOST:mailpit}
    smtp-port: ${SMTP_PORT:1025}
    allow-smtp-in-production: ${ALLOW_SMTP_IN_PRODUCTION:false}
    connect-timeout-ms: ${PROVIDER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PROVIDER_READ_TIMEOUT_MS:10000}
  sending:
    suppression-hash-key: ${SUPPRESSION_HASH_KEY:}
    suppression-reject-mode: ${SUPPRESSION_REJECT_MODE:accept}
    allowed-recipient-domains: ${ALLOWED_RECIPIENT_DOMAINS:}
    max-request-bytes: ${MAX_REQUEST_BYTES:262144}
    send-at-max-days: ${SEND_AT_MAX_DAYS:30}
    send-at-past-tolerance-seconds: ${SEND_AT_PAST_TOLERANCE_SECONDS:60}
    max-batch-items: ${MAX_BATCH_ITEMS:100}
    max-batch-bytes: ${MAX_BATCH_BYTES:1048576}
  worker:
    concurrency: ${WORKER_CONCURRENCY:4}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:1000}
    max-attempts: ${MAX_ATTEMPTS:6}
    retry-backoff-seconds: ${RETRY_BACKOFF_SECONDS:60,300,900,3600,21600}
    lock-timeout-seconds: ${LOCK_TIMEOUT_SECONDS:60}
    variables-retention-days: ${VARIABLES_RETENTION_DAYS:7}
    idempotency-retention-hours: ${IDEMPOTENCY_RETENTION_HOURS:24}
    sent-final-after-hours: ${SENT_FINAL_AFTER_HOURS:72}
    queue-age-alert-seconds: ${QUEUE_AGE_ALERT_SECONDS:300}
  provider:
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com}
    worker-provider-rps: ${WORKER_PROVIDER_RPS:8}
    circuit-breaker-failures: ${CIRCUIT_BREAKER_FAILURES:5}
    circuit-breaker-open-seconds: ${CIRCUIT_BREAKER_OPEN_SECONDS:60}
    webhook-signing-secrets: ${MAIL_WEBHOOK_SIGNING_SECRET:}
    webhook-tolerance-seconds: ${WEBHOOK_TOLERANCE_SECONDS:300}
