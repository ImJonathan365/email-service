<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222222">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td style="max-width:560px;margin:0 auto;padding:24px;background:#ffffff;border-radius:8px">
        <h1 style="font-size:20px;margin:0 0 16px">Hi {{firstName}}</h1>
        <p style="font-size:15px;line-height:22px">We received a request to reset your password.</p>
        <p style="margin:24px 0">
          <a href="{{resetUrl}}" style="background:#1a73e8;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none">Reset password</a>
        </p>
        <p style="font-size:13px;color:#666666">The link expires in {{expiresInMinutes}} minutes. If you did not ask for it, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
