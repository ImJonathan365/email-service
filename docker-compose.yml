# Local development only (docs/05 §7): app + PostgreSQL with the three roles + Mailpit.
# Usage: cp .env.example .env && docker compose up --build
# Other local projects join the network email-service-net and call http://email-service:8080
# (docs/12-status-and-local-use.md).

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: email_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by scripts/init-db-roles.sql on the first start of an empty volume.
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:?set DB_SYSTEM_PASSWORD in .env}
    volumes:
      - ./scripts/init-db-roles.sql:/docker-entrypoint-initdb.d/10-init-db-roles.sql:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_service"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    restart: unless-stopped
    networks:
      default:
        aliases: [email-service]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_ROLE: all
      DB_URL: jdbc:postgresql://postgres:5432/email_service
      DB_APP_USER: ${DB_APP_USER:-email_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_SYSTEM_USER: ${DB_SYSTEM_USER:-email_system}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD}
      DB_OWNER_USER: ${DB_OWNER_USER:-email_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:?set ADMIN_API_KEYS in .env}
      SUPPRESSION_HASH_KEY: ${SUPPRESSION_HASH_KEY:?set SUPPRESSION_HASH_KEY in .env}
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Enables POST /webhooks/resend for scripts/simulate-event.sh; a local secret, never Resend's.
      MAIL_WEBHOOK_SIGNING_SECRET: ${MAIL_WEBHOOK_SIGNING_SECRET:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

# A fixed name, whatever the folder is called, so other projects can declare it as external.
networks:
  default:
    name: email-service-net

volumes:
  pgdata:
